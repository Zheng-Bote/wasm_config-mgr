[package]
name = "wasm_config-mgr"
version = "0.1.0"
edition = "2024"
description = "WASI Preview 2 AES-256-GCM INI configuration manager with policy and cryptographic token authorization"
license = "MIT OR Apache-2.0"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "getrandom", "std"] }
argon2 = "0.5.3"
base64 = "0.22.1"
curve25519-dalek = "4.1.3"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
getrandom = "0.2.17"
hex = "0.4.3"
hmac = "0.12.1"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.20"
wit-bindgen = { version = "0.40.0", optional = true }
zeroize = { version = "1.9.0", features = ["derive"] }

[features]
wit-bindgen = ["dep:wit-bindgen"]
