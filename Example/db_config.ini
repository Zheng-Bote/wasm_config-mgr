# ============================================================================
# Example INI for wasm_config-mgr (Example/db_config.ini)
# ============================================================================
# The reserved section [__policy__] defines which programs (clients)
# can access which sections/keys with what cryptographic key.
# This file is encrypted with AES-256-GCM into `Example/db_config.wcfg`.

[__policy__]
# Authorized Python client application "python_db_app":
# Authenticates via HMAC-SHA256 and is allowed to read all entries under [database].
client.python_db_app.hmac_secret = 4f8b2c19a7d3e605112233445566778899aabbccddeeff00123456789abcdef0
client.python_db_app.allow = database.*

# Additional service "reporting_worker" (only allowed to read host and port, NOT password):
client.reporting_worker.hmac_secret = 99887766554433221100ffeeddccbbaa99887766554433221100ffeeddccbbaa
client.reporting_worker.allow = database.host, database.port

